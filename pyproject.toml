[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lowbit_comm"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
cuda = ["torch"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lowbit_comm*"]
exclude = ["tests*"]

[tool.setuptools.dynamic]
version = {attr = "lowbit_comm._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest_tmp_lowbit_comm"
