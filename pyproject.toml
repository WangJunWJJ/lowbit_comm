[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lowbit_comm"
version = "0.3.0"
description = "High-performance low-bit communication library for distributed training."
requires-python = ">=3.10"
authors = [{ name = "CCDL / ParaScale contributors" }]
dependencies = []

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["lowbit_comm*"]

[tool.setuptools.package-data]
"lowbit_comm.backends.cuda" = [
  "csrc/**/*.cpp",
  "csrc/**/*.cu",
  "csrc/**/*.cuh",
  "csrc/**/*.h",
  "csrc/**/*.json",
  "csrc/**/*.py",
]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--basetemp=.pytest_tmp_lowbit_comm"
